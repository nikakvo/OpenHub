# Public build settings. Do not put secrets here: this file is in git.
# Put your own values in local.properties (not in git) or pass them as Gradle
# properties (-Pkey=value or ORG_GRADLE_PROJECT_<key> environment variables).
#
# GitHub OAuth App used for "Login with browser". Create your own at
# https://github.com/settings/developers (Redirect URI: openhub://login) and set
#   openhub_client_id=...
#   openhub_client_secret=...
# in local.properties. Without them the app offers login with a personal access
# token only.
openhub_client_id=
openhub_client_secret=

# Release signing (optional). Without sign_path, release builds are signed with
# the debug key so the APK still installs. build.sh passes these from a keystore.
#   sign_path=/path/to/keystore.jks
#   store_password=...
#   key_alias=...
#   key_password=...
